<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance - Iris Attendance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-container">
        <!-- Header -->
        <header class="header">
            <button class="back-btn" onclick="goBack()">← Back</button>
            <h1>Mark Attendance</h1>
        </header>

        <!-- Attendance Form -->
        <div class="form-container" id="formSection">
            <div class="info-box">
                <p>📸 Take a photo for attendance verification</p>
            </div>

            <div class="form-group">
                <label>Capture Face Photo *</label>
                <div class="camera-container">
                    <video id="cameraVideo" autoplay muted playsinline webkit-playsinline></video>
                    <button type="button" class="capture-btn" onclick="captureAttendancePhoto()">📸 Capture Photo</button>
                </div>
                <canvas id="canvas" style="display:none;"></canvas>
                <div id="photoPreview" class="photo-preview"></div>
            </div>

            <div class="form-group">
                <label for="mealStatus">Mid-Day Meal Status *</label>
                <select id="mealStatus">
                    <option value="">-- Select --</option>
                    <option value="Taken">✅ Meal Taken</option>
                    <option value="Not Taken">❌ Meal Not Taken</option>
                </select>
            </div>

            <button class="submit-btn" onclick="submitAttendance()">✅ Mark Attendance</button>
            <div id="message" class="message"></div>
        </div>

        <!-- Face Verification Section -->
        <div id="faceVerificationSection" class="form-container" style="display:none;">
            <h2 style="text-align: center; color: #1e40af; margin-bottom: 20px;">👤 Face Verification</h2>
            
            <div class="face-comparison">
                <div class="face-box">
                    <p style="text-align: center; font-weight: 600; color: #1e293b; margin-bottom: 10px;">📸 Your Photo</p>
                    <div id="capturedFaceDisplay" class="face-image"></div>
                </div>

                <div class="face-arrow">
                    <p style="font-size: 30px;">🔄</p>
                </div>

                <div class="face-box">
                    <p style="text-align: center; font-weight: 600; color: #1e293b; margin-bottom: 10px;">📋 Registered Face</p>
                    <div id="registeredFaceDisplay" class="face-image"></div>
                </div>
            </div>

            <!-- Student Info -->
            <div class="student-info-box">
                <h3 id="studentNameDisplay" style="color: #1e40af; margin-bottom: 10px;">Student Name</h3>
                <p><strong>Student ID:</strong> <span id="studentIdDisplay">---</span></p>
                <p><strong>Class:</strong> <span id="studentClassDisplay">---</span></p>
                <p><strong>Meal Status:</strong> <span id="mealStatusDisplay">---</span></p>
            </div>

            <!-- Confirm/Cancel Buttons -->
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="submit-btn" style="flex: 1;" onclick="confirmAttendance()">✅ Confirm & Submit</button>
                <button class="secondary-btn" style="flex: 1;" onclick="retakePhoto()">📸 Retake Photo</button>
            </div>

            <div id="verificationMessage" class="message"></div>
        </div>

        <!-- Success Section -->
        <div id="attendanceSummary" class="form-container" style="display:none;">
            <div class="summary-box">
                <h3>✅ Attendance Marked Successfully!</h3>
                <p id="summaryDetails" style="margin: 20px 0;"></p>
                <button class="secondary-btn" onclick="location.reload()">📸 Mark Another</button>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Real-time biometric attendance tracking</p>
        </footer>
    </div>

    <script src="attendance.js"></script>
</body>
</html>
